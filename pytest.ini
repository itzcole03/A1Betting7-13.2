[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:faker
# 'env' was previously set here (TESTING=1). Pytest doesn't recognize an
# 'env' key in pytest.ini and emits a PytestConfigWarning. Environment
# variables should be set in CI or via a plugin (e.g. pytest-env) if desired.
# Removed the key to silence the config warning; set TESTING=1 in the CI job
# or run locally as: TESTING=1 pytest ...

# NOTE: Temporary DeprecationWarning suppression removed to surface remaining
# deprecation warnings and finish the Pydantic v1 -> v2 migration. If you want
# to re-enable a specific filter after fixes, add a focused filter for that
# particular warning class or module instead of ignoring all DeprecationWarning.

# Ignore scripts directory which contains helpers that perform network calls during import
norecursedirs = scripts tests/security/headers

# AsyncIO mode
asyncio_mode = auto
# Explicit pytest-asyncio setting to avoid deprecation warnings about default loop scope
asyncio_default_fixture_loop_scope = function
