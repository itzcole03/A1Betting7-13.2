@keyframes float {
  0%,
  100% {
    transform: translateY(0px) rotateY(0deg);
  }
  50% {
    transform: translateY(-8px) rotateY(5deg);
  }
}
@keyframes glow-pulse {
  0% {
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.4),
      0 0 40px rgba(0, 255, 136, 0.2);
  }
  100% {
    box-shadow: 0 0 40px rgba(0, 255, 136, 0.8),
      0 0 80px rgba(0, 255, 136, 0.4);
  }
}
@keyframes slide-in-up {
  0% {
    opacity: 0;
    transform: translateY(30px) scale(0.95);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
@keyframes slide-in-right {
  0% {
    opacity: 0;
    transform: translateX(30px) scale(0.95);
  }
  100% {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}
@keyframes data-flow {
  0% {
    transform: translateX(-100%) rotateZ(0deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateX(100vw) rotateZ(360deg);
    opacity: 0;
  }
}
@keyframes matrix-rain {
  0% {
    transform: translateY(-100%);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateY(100vh);
    opacity: 0;
  }
}
@keyframes energy-wave {
  0% {
    transform: scaleX(1) scaleY(1);
    opacity: 1;
  }
  50% {
    transform: scaleX(1.2) scaleY(0.8);
    opacity: 0.7;
  }
  100% {
    transform: scaleX(1) scaleY(1);
    opacity: 1;
  }
}
.holographic {
  background: linear-gradient(45deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #ff006e);
  background-size: 600% 600%;
  animation: gradient-shift 10s ease infinite,
    hologram-flicker 3s ease infinite;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 900;
  letter-spacing: 0.05em;
}
@keyframes gradient-shift {
  0% {
    background-position: 0% 50%;
  }
  25% {
    background-position: 100% 50%;
  }
  50% {
    background-position: 100% 100%;
  }
  75% {
    background-position: 0% 100%;
  }
  100% {
    background-position: 0% 50%;
  }
}
@keyframes hologram-flicker {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.8;
  }
  60% {
    opacity: 1;
  }
  70% {
    opacity: 0.9;
  }
}
.ultra-glass {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(25px) saturate(200%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
}
.dark .ultra-glass {
  background: rgba(0, 0, 0, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.03);

.quantum-bg {
  background: radial-gradient(circle at 20% 50%, rgba(0, 255, 136, 0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(124, 58, 237, 0.04) 0%, transparent 50%),
    radial-gradient(circle at 40% 80%, rgba(0, 212, 255, 0.04) 0%, transparent 50%),
    linear-gradient(135deg, #0f172a 0%, #1e1b4b 25%, #581c87 50%, #1e1b4b 75%, #0f172a 100%);
  background-size: 100% 100%,
    100% 100%,
    100% 100%,
    100% 100%;
  position: relative;
}
.quantum-bg::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: radial-gradient(circle at 25px 25px, rgba(0, 255, 136, 0.1) 2px, transparent 2px),
    radial-gradient(circle at 75px 75px, rgba(124, 58, 237, 0.1) 2px, transparent 2px);
  background-size: 100px 100px,
    150px 150px;
  opacity: 0.3;
  animation: matrix-rain 20s linear infinite;
}
.quantum-card {
  background: rgba(255, 255, 255, 0.02);
  backdrop-filter: blur(30px) saturate(180%);
  border: 2px solid rgba(255, 255, 255, 0.06);
  box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    0 0 30px rgba(0, 255, 136, 0.1);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  overflow: hidden;
}
.quantum-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.8), transparent);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.quantum-card:hover::before {
  opacity: 1;
}
.quantum-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.2),
    0 0 50px rgba(0, 255, 136, 0.3);
  border-color: rgba(0, 255, 136, 0.3);
}
@keyframes quantum-spin {
  0% {
    transform: rotate(0deg) scale(1);
  }
  25% {
    transform: rotate(90deg) scale(1.1);
  }
  50% {
    transform: rotate(180deg) scale(1);
  }
  75% {
    transform: rotate(270deg) scale(0.9);
  }
  100% {
    transform: rotate(360deg) scale(1);
  }
}
@keyframes neural-pulse {
  0%,
  100% {
    opacity: 0.6;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.05);
  }
}
