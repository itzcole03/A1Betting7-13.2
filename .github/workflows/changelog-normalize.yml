name: Changelog normalization check

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'scripts/normalize_changelog.py'
      - '.github/workflows/changelog-normalize.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'CHANGELOG.md'
      - 'scripts/normalize_changelog.py'
      - '.github/workflows/changelog-normalize.yml'
  workflow_call: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run normalizer in strict mode
        run: python scripts/normalize_changelog.py --file CHANGELOG.md --strict

      - name: Fix hint
        if: failure()
        run: |
          echo "::error::CHANGELOG normalization needed. Run 'npm run changelog:fix' locally and commit the changes."