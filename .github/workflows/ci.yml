name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-checks:
    name: Backend quick checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: ./
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Quick syntax check (py_compile)
        working-directory: ./
        run: |
          python - <<'PY'
import py_compile, glob
files = glob.glob('backend/**/*.py', recursive=True)
failed = False
for f in files:
    try:
        py_compile.compile(f, doraise=True)
    except Exception as e:
        print(f'PY_COMPILE_ERROR: {f}: {e}')
        failed = True
if failed:
    raise SystemExit(1)
print('PY_COMPILE: all backend files compiled')
PY

      - name: Run pytest (fail fast)
        working-directory: ./
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest --maxfail=1 -q || true
          else
            echo 'pytest not installed - skipping'
          fi

      - name: Extract TODOs & generate digest
        working-directory: ./
        run: |
          if [ -f scripts/extract_digest_for_docs.py ]; then
            python scripts/extract_digest_for_docs.py || true
          else
            echo 'no extractor script found'
          fi

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codebase-digest
          path: |
            ROADMAP.md
            scripts/extract_digest_for_docs.py
            backend/logs/ || true
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  changelog:
    name: Changelog Normalization
    uses: ./.github/workflows/changelog-normalize.yml

  backend:
    name: Backend Tests (coverage)
    needs: [changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest coverage

      - name: Run pytest with coverage
        env:
          USE_FREE_INGESTION: 'false'
        run: |
          coverage run -m pytest -q
          coverage xml
          coverage report -m

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    name: Frontend TypeCheck & Tests
    needs: [changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Tests (CI)
        working-directory: frontend
        run: npm run test:ci

  markdown:
    name: Markdown Lint (remark)
    needs: [changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run remark
        run: npx remark . --frail
