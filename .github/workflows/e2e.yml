name: E2E (docker-compose + seed)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services with docker-compose
        run: |
          docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for backend healthy
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "backend healthy" && break
            fi
            echo "waiting for backend..." && sleep 2
          done

      - name: Seed backend test data
        run: |
          chmod +x scripts/seed_test_data.sh
          ./scripts/seed_test_data.sh http://localhost:8000

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend preview
        working-directory: frontend
        run: |
          npm run build
          npm run preview &
          sleep 2

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_FRONTEND_BASE_URL: http://localhost:4173
          VITE_BACKEND_URL: http://localhost:8000
        run: |
          npx playwright install --with-deps
          npx playwright test --reporter=list

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down --volumes
