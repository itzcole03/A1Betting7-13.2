name: Shims guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check-shims:
    runs-on: ubuntu-latest
    name: Ensure heavy optional imports are isolated
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Run shim guard
        run: |
          python -m pip install --upgrade pip
          python tools/check_shims.py
